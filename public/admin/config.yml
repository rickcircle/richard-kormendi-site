# Decap CMS konfiguráció
# Backend: GitHub OAuth — a repo-t pushold GitHub-ra és állítsd be az OAuth App-ot
# Részletes leírás: /DECAP_SETUP.md

backend:
  name: github
  repo: rickcircle/richard-kormendi-site
  branch: main
  base_url: https://richardkormendi.com
  auth_endpoint: /api/auth

media_folder: public/media
public_folder: /media

locale: hu

collections:
  # Koncertek kezelése
  - name: shows
    label: Koncertek
    files:
      - label: Koncertlista
        name: shows
        file: src/data/shows.json
        fields:
          - label: Koncertek
            name: shows
            widget: list
            summary: "{{fields.venue}} — {{fields.city}} ({{fields.date}})"
            fields:
              - { label: Dátum, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
              - { label: Helyszín, name: venue, widget: string }
              - { label: Város, name: city, widget: string }
              - { label: Ország, name: country, widget: string, required: false, default: "Hungary" }
              - { label: Jegyek URL, name: ticketUrl, widget: string, required: false, hint: "Hagyd üresen ha nincs jegy" }

  # Audit Log — automatikusan töltődik fel, ne szerkeszd kézzel
  - name: audit_log
    label: "📊 Audit Log"
    label_singular: Audit
    folder: content/audits
    create: false
    delete: false
    extension: md
    format: frontmatter
    identifier_field: url
    summary: "{{fields.mobile_score}}📱  {{fields.desktop_score}}🖥  — {{fields.url}} — {{fields.fixable_label}}"
    sortable_fields: ['date', 'mobile_score', 'desktop_score']
    fields:
      - { label: URL, name: url, widget: string }
      - { label: Dátum, name: date, widget: datetime }
      - { label: "📱 Mobil pontszám", name: mobile_score, widget: number }
      - { label: "🖥 Asztali pontszám", name: desktop_score, widget: number }
      - { label: Értékelés, name: fixable_label, widget: string }
      - { label: "Becsült munkaidő", name: fixable_hours, widget: string, required: false }
      - { label: Magyarázat, name: fixable_reason, widget: text }

  # Fotógaléria kezelése
  - name: gallery
    label: Fotók
    files:
      - label: Fotógaléria
        name: photos
        file: src/data/photos.json
        fields:
          - label: Fotók
            name: photos
            widget: list
            summary: "{{fields.alt}}"
            fields:
              - { label: Fotó, name: src, widget: image }
              - { label: Alt szöveg, name: alt, widget: string, hint: "Leírás az akadálymentesítéshez (pl. Richard Körmendi – stúdió portré)" }
              - { label: Felirat, name: caption, widget: string, required: false }
