<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Richard Körmendi</title>
  <meta name="robots" content="noindex, nofollow" />
</head>
<body>
  <script>window.CMS_MANUAL_INIT = true;</script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    CMS.init({
      config: {
        backend: {
          name: "github",
          repo: "rickcircle/richard-kormendi-site",
          branch: "main",
          base_url: "https://richardkormendi.com",
          auth_endpoint: "/api/auth"
        },
        media_folder: "public/media",
        public_folder: "/media",
        locale: "hu",
        collections: [
          {
            name: "audit_log",
            label: "📊 Audit Log",
            label_singular: "Audit",
            folder: "content/audits",
            create: false,
            delete: false,
            extension: "md",
            format: "frontmatter",
            identifier_field: "url",
            summary: "{{fields.contact_note}} — {{fields.url}} (📱{{fields.mobile_score}} 🖥{{fields.desktop_score}})",
            sortable_fields: ["date", "mobile_score", "desktop_score"],
            fields: [
              { label: "URL", name: "url", widget: "string" },
              { label: "Dátum", name: "date", widget: "datetime" },
              { label: "📱 Mobil pontszám", name: "mobile_score", widget: "number" },
              { label: "🖥 Asztali pontszám", name: "desktop_score", widget: "number" },
              { label: "Értékelés", name: "fixable_label", widget: "string" },
              { label: "Becsült munkaidő", name: "fixable_hours", widget: "string", required: false },
              { label: "Magyarázat", name: "fixable_reason", widget: "text" },
              { label: "Érdemes megkeresni?", name: "contact_worthy", widget: "boolean", required: false },
              { label: "Megkeresési tanács", name: "contact_note", widget: "string", required: false },
              { label: "📋 Másolható üzenet az ügyfélnek", name: "client_message", widget: "text", required: false }
            ]
          },
          {
            name: "shows",
            label: "Koncertek",
            files: [
              {
                label: "Koncertlista",
                name: "shows",
                file: "src/data/shows.json",
                fields: [
                  {
                    label: "Koncertek",
                    name: "shows",
                    widget: "list",
                    summary: "{{fields.venue}} — {{fields.city}}",
                    fields: [
                      { label: "Dátum", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false },
                      { label: "Helyszín", name: "venue", widget: "string" },
                      { label: "Város", name: "city", widget: "string" },
                      { label: "Ország", name: "country", widget: "string", required: false, default: "Hungary" },
                      { label: "Jegyek URL", name: "ticketUrl", widget: "string", required: false, hint: "Hagyd üresen ha nincs jegy" }
                    ]
                  }
                ]
              }
            ]
          },
          {
            name: "gallery",
            label: "Fotók",
            files: [
              {
                label: "Fotógaléria",
                name: "photos",
                file: "src/data/photos.json",
                fields: [
                  {
                    label: "Fotók",
                    name: "photos",
                    widget: "list",
                    summary: "{{fields.alt}}",
                    fields: [
                      { label: "Fotó", name: "src", widget: "image" },
                      { label: "Alt szöveg", name: "alt", widget: "string" },
                      { label: "Felirat", name: "caption", widget: "string", required: false }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    });
  </script>
</body>
</html>
