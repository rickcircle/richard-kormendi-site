<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0b0a08"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#grad)"/>
  <defs>
    <radialGradient id="grad" cx="50%" cy="45%" r="70%">
      <stop offset="0%" style="stop-color:#e8963a;stop-opacity:0.14"/>
      <stop offset="100%" style="stop-color:#e8963a;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <!-- Subtle grid line -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  <!-- Out now badge -->
  <rect x="466" y="176" width="268" height="34" rx="17" fill="#e8963a" fill-opacity="0.12" stroke="#e8963a" stroke-opacity="0.35"/>
  <text x="600" y="198" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="13" font-weight="500" fill="#e8963a" text-anchor="middle"
    letter-spacing="2">OUT NOW — YOU BECOME MY ONLY</text>
  <!-- Name -->
  <text x="600" y="300" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="80" font-weight="700" fill="#f5f1ea" text-anchor="middle"
    letter-spacing="-3">Richard Körmendi</text>
  <!-- Subtitle -->
  <text x="600" y="360" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="26" font-weight="300" fill="rgba(245,241,234,0.55)" text-anchor="middle"
    letter-spacing="4">SINGER-SONGWRITER · TENOR</text>
  <!-- Divider -->
  <rect x="560" y="395" width="80" height="2" fill="#e8963a" fill-opacity="0.5"/>
</svg>
