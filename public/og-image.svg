<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#1a1a1a"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#grad)"/>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.05"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <!-- Subtle grid line -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  <!-- Name -->
  <text x="600" y="270" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="80" font-weight="700" fill="#ffffff" text-anchor="middle"
    letter-spacing="-3">Richard Körmendi</text>
  <!-- Subtitle -->
  <text x="600" y="340" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="28" font-weight="300" fill="#888888" text-anchor="middle"
    letter-spacing="4">MUSICIAN · DIGITAL PROFESSIONAL</text>
  <!-- Divider -->
  <rect x="560" y="375" width="80" height="2" fill="#444444"/>
</svg>
